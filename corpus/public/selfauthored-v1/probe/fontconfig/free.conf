<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Font substitution for the construction probe: reject Liberation and DejaVu and map the generic families to GNU FreeFont. Use with FONTCONFIG_FILE=<this file>. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/*</glob>
    </rejectfont>
  </selectfont>
  <alias binding="strong"><family>Arial</family><prefer><family>FreeSans</family></prefer></alias>
  <alias binding="strong"><family>Times New Roman</family><prefer><family>FreeSerif</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>FreeSans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>FreeSerif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>FreeMono</family></prefer></alias>
  <alias binding="strong"><family>Monospace</family><prefer><family>FreeMono</family></prefer></alias>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
