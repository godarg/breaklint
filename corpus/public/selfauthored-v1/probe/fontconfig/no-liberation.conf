<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Font substitution for the construction probe: reject Liberation, so Chromium falls back to DejaVu for serif, sans-serif and monospace. Use with FONTCONFIG_FILE=<this file>. -->
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
