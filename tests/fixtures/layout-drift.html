<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 120mm 80mm; margin: 10mm; }
    body { font: 10pt/1.4 serif; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(40px); } }
    p { animation: drift 73ms linear infinite alternate; }
  </style>
</head>
<body><p id="moving">Diese Geometrie darf die Freeze-Signatur niemals als stabil zertifizieren.</p></body>
</html>
