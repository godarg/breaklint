<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
@page{size:120mm 80mm;margin:10mm}
@keyframes move { from { transform:translateX(0) } to { transform:translateX(20px) } }
p{animation:move 10s linear infinite}
</style></head>
<body>
  <p>The author must not be able to remove an intervention while it is still reported.</p>
  <script>
    new MutationObserver(() => {
      for (const style of document.querySelectorAll('style')) {
        if (style.getAttribute('data-breaklint-intervention') === 'animations-disabled') style.remove();
      }
    }).observe(document.documentElement, { childList: true, subtree: true });
  </script>
</body></html>
