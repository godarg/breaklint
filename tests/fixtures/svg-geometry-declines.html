<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG geometry that must decline rather than guess</title>
<style>
  @page { size: 360pt 520pt; margin: 24pt; }
  body { font: 11pt/1.35 serif; margin: 0; }
  svg { display: block; width: 260pt; height: 100pt; margin-bottom: 10pt; }
</style>
</head>
<body>
<p>Each complex paint case stays visible in coverage instead of producing a guessed verdict.</p>

<svg id="transparent-paints" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="40" fill="rgba(20, 30, 40, 0)">Alpha zero</text>
  <text x="10" y="80" style="color: transparent; fill: currentColor">Transparent currentColor</text>
  <text x="10" y="120">Ordinary fill text</text>
</svg>

<svg id="complex-paints" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="empty-clip"><rect width="1" height="1"></rect></clipPath>
    <mask id="black-mask"><rect width="100%" height="100%" fill="black"></rect></mask>
    <filter id="zero-alpha"><feComponentTransfer><feFuncA type="linear" slope="0"></feFuncA></feComponentTransfer></filter>
    <text id="used-text" x="360" y="130">Instantiated text</text>
    <symbol id="used-symbol"><use href="#used-text"></use></symbol>
  </defs>
  <text x="10" y="25">Ordinary fill text</text>
  <text x="360" y="50" clip-path="url(#empty-clip)">Clipped</text>
  <text x="360" y="75" mask="url(#black-mask)">Masked</text>
  <text x="360" y="100" filter="url(#zero-alpha)">Filtered</text>
  <text x="360" y="125" fill="none" stroke="black" stroke-width="20">Stroke</text>
  <use href="#used-text"></use>
  <use href="#used-symbol"></use>
</svg>

<!-- Declined up to 0.6.0; measured since the viewport is reconstructed from the content box. -->
<svg id="border-box" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg"
     style="box-sizing: content-box; border: 8px solid #333; padding: 6px">
  <text x="10" y="80">The viewport is not this element's border box</text>
</svg>

<!--
  Viewport geometry that still declines, one case per figure, each counted against coverage.
  The clip rectangle of every one is either not a rectangle, not in the SVG's own frame, or not
  what its attributes say, and none of that is reconstructed in this build.
-->
<svg id="rounded-clip" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" style="border-radius: 16px">
  <text x="10" y="80">A rounded clip is not a rectangle</text>
</svg>

<svg id="radius-with-margin" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg"
     style="padding: 8px; border-radius: 4px; overflow-clip-margin: content-box 6px">
  <text x="10" y="80">A clip margin grows the corner curve too</text>
</svg>

<div style="perspective: 300px"><div style="transform: rotateY(20deg)">
<svg id="perspective" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="80">Under perspective the screen map is not affine</text>
</svg>
</div></div>

<svg id="mixed-overflow" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" style="overflow-x: visible; overflow-y: clip">
  <text x="10" y="80">One axis clips, the other does not</text>
</svg>

<svg id="nested-transform-outer" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <svg id="nested-transform" x="20" y="20" width="300" height="100" transform="translate(10 5)" style="width: 300px; height: 100px">
    <text x="10" y="60">A transformed nested viewport</text>
  </svg>
</svg>

<svg id="nested-css-outer" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <svg id="nested-css-sized" x="20" y="20" width="300" height="100" style="width: 200px; height: 60px">
    <text id="css-sized-in" x="10" y="40">CSS-sized</text>
  </svg>
</svg>

<svg id="foreign-outer" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="10" y="10" width="380" height="130">
    <div><svg id="inside-foreign-object" viewBox="0 0 300 100" style="width: 300px; height: 100px">
      <text x="10" y="50">A foreignObject clips this too</text>
    </svg></div>
  </foreignObject>
</svg>

<!--
  Clips this build does not rebuild. A clip-path on the outermost SVG, or an HTML ancestor that
  clips an SVG with no clip of its own, cuts drawn text wherever it lies: clipped, and declined —
  0.6.0 called both non-applicable because the SVG's own overflow is visible.
  An ancestor clip that provably contains the SVG's own clip is set aside, and that SVG is measured.
-->
<svg id="root-clip-path" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" style="overflow: visible; clip-path: inset(0 40px 0 0)">
  <text x="10" y="80">A clip-path on the SVG itself</text>
</svg>

<div style="overflow: hidden; width: 200pt; height: 100pt">
<svg id="under-clipping-ancestor" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" style="overflow: visible">
  <text x="10" y="80">An ancestor clips an SVG that does not</text>
</svg>
</div>

<div style="overflow: hidden; padding: 6pt">
<svg id="inside-clipping-ancestor" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="80">An ancestor clip around the whole viewport</text>
</svg>
</div>

<!-- Per-glyph rotation moves ink off the getBBox cell (2.25 px measured with spacingAndGlyphs). -->
<svg id="rotated-glyphs" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="80" rotate="0 10 20 30" textLength="200" lengthAdjust="spacingAndGlyphs">Rotated glyphs</text>
</svg>

<!-- A nested SVG with mixed axes: auto hidden, measured not to clip at all. -->
<svg id="nested-mixed-outer" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <svg id="nested-mixed" x="20" y="20" width="300" height="100" style="width: 300px; height: 100px; overflow-x: visible; overflow-y: hidden">
    <text x="10" y="60">Mixed axes on a nested viewport</text>
  </svg>
</svg>

<!--
  Where the painted clip is not the one the frame can rebuild. Under a CSS transform the browser
  snaps the SVG's clip and paint offset in the transform's space, not the page's; a slotted SVG is
  clipped by a shadow tree no DOM walk visits. Both decline.
-->
<div style="transform: rotate(15deg); transform-origin: 0 0; margin-left: 30px; height: 150pt">
<svg id="rotated-ancestor" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="80">A rotated ancestor snaps in its own space</text>
</svg>
</div>

<x-clip><svg id="slotted" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="80">Slotted into a clipping shadow tree</text>
</svg></x-clip>

<x-clip><svg id="slotted-visible" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" style="overflow: visible">
  <text x="250" y="80">Slotted, overflow visible, still cut</text>
</svg></x-clip>

<!-- A mask-box image clips like a mask: on the SVG, on an ancestor, with the SVG's overflow visible. -->
<svg id="mask-box" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" style="-webkit-mask-box-image: linear-gradient(to right, black 50%, transparent 50%) 0 fill">
  <text x="10" y="80">A mask-box image on the SVG</text>
</svg>

<div style="-webkit-mask-box-image: linear-gradient(to right, black 50%, transparent 50%) 0 fill">
<svg id="mask-box-ancestor" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="80">A mask-box image on an ancestor</text>
</svg>
</div>

<!-- A clipping wrapper two parent steps up, narrower than the SVG: the CDP walk must reach it. -->
<div style="overflow: hidden; width: 150pt"><div style="width: 300pt">
<svg id="two-steps-below-clip" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="80">Below a narrow wrapper, two steps up</text>
</svg>
</div></div>

<svg id="many-definitions" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs id="generated-definitions"></defs>
  <text x="10" y="80">One painted target</text>
</svg>
<script>
  customElements.define("x-clip", class extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      this.attachShadow({ mode: "open" }).innerHTML = '<div style="overflow: hidden; width: 150pt"><slot></slot></div>';
    }
  });
  const definitions = document.getElementById("generated-definitions");
  for (let index = 0; index < 501; index += 1) {
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("id", `definition-${index}`);
    text.textContent = "Never instantiated";
    definitions.appendChild(text);
  }
</script>
</body>
</html>
