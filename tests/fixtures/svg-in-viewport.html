<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG entirely inside its viewport</title>
<!--
  The document 0.2.2 could not check, and the one this release exists for.

  Nothing here is wrong. Two figures, every label comfortably inside its viewport, one of them a
  chart with repeated axis ticks. The expected verdict is `clean` and exit 0 — and that is the
  whole point: 0.2.2 answered exit 3 on exactly this, because the collector declared every SVG
  unmeasurable with a reason the gating rule had not declared.

  Kept apart from `svg-text-geometry.html` deliberately. That fixture ends exit 1 by design, so it
  can never show that a sound document passes; a suite in which no case ends 0 cannot tell "the
  tool works" from "the tool always complains". This is the positive control.

  The second figure also carries four `<text>` elements with identical content and no `id`. They
  share one content-derived identity, and a finding on any of them has to say the group is larger
  than one rather than quietly claim to be a single target. Nothing here triggers a finding, so
  the assertion is on the snapshot, not on a report.
-->
<style>
  @page { size: 320pt 420pt; margin: 24pt; }
  body { font: 12pt/1.5 serif; margin: 0; }
  figure { margin: 0 0 18pt; }
  svg { display: block; width: 260pt; height: 130pt; }
  figcaption { font-size: 9pt; }
</style>
</head>
<body>
<p>Two ordinary figures. Nothing in this document is a defect.</p>

<figure>
  <svg id="plain" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="400" height="200" fill="#eeeeee"></rect>
    <text x="40" y="100" font-size="14" font-family="serif">A label, well inside</text>
  </svg>
  <figcaption>One label, one viewport, nothing to report.</figcaption>
</figure>

<figure>
  <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="400" height="200" fill="#eeeeee"></rect>
    <line x1="60" y1="20" x2="60" y2="170" stroke="#333333" stroke-width="2"></line>
    <line x1="60" y1="170" x2="380" y2="170" stroke="#333333" stroke-width="2"></line>
    <rect x="80" y="90" width="40" height="80" fill="#7799aa"></rect>
    <rect x="150" y="60" width="40" height="110" fill="#7799aa"></rect>
    <rect x="220" y="110" width="40" height="60" fill="#7799aa"></rect>
    <rect x="290" y="40" width="40" height="130" fill="#7799aa"></rect>
    <text x="94" y="188" font-size="12" font-family="serif">0</text>
    <text x="164" y="188" font-size="12" font-family="serif">0</text>
    <text x="234" y="188" font-size="12" font-family="serif">0</text>
    <text x="304" y="188" font-size="12" font-family="serif">0</text>
    <text x="30" y="174" font-size="12" font-family="serif">y</text>
  </svg>
  <figcaption>Four identical tick labels: one identity, group size four.</figcaption>
</figure>
<figure>
  <!--
    A second chart, byte-identical in structure to the first, and NEITHER carries an `id`:
    `svgRootKey` falls back to a hash over canonicalised markup, which is the path this case is
    supposed to exercise. With an id on both, the shared identity would follow from the duplicate
    id instead and the assertion would pass either way. Both share one root identity on purpose — which of two identical objects is
    meant is not a well-formed question. Their tick labels therefore share `svgTextKey` ACROSS
    records, and the ambiguity group is a property of the document rather than of one record:
    eight targets, not two groups of four. Counting it inside a record reported 1 for exactly this
    collision until a second review pointed it out.
  -->
  <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="400" height="200" fill="#eeeeee"></rect>
    <line x1="60" y1="20" x2="60" y2="170" stroke="#333333" stroke-width="2"></line>
    <line x1="60" y1="170" x2="380" y2="170" stroke="#333333" stroke-width="2"></line>
    <rect x="80" y="90" width="40" height="80" fill="#7799aa"></rect>
    <rect x="150" y="60" width="40" height="110" fill="#7799aa"></rect>
    <rect x="220" y="110" width="40" height="60" fill="#7799aa"></rect>
    <rect x="290" y="40" width="40" height="130" fill="#7799aa"></rect>
    <text x="94" y="188" font-size="12" font-family="serif">0</text>
    <text x="164" y="188" font-size="12" font-family="serif">0</text>
    <text x="234" y="188" font-size="12" font-family="serif">0</text>
    <text x="304" y="188" font-size="12" font-family="serif">0</text>
    <text x="30" y="174" font-size="12" font-family="serif">y</text>
  </svg>
  <figcaption>The same chart again: one identity across two records.</figcaption>
</figure>

<figure>
  <!--
    A nested <svg>. querySelectorAll reaches into it from the outer element, so its label was
    collected twice — once by the inner record, and once by the outer one, where it was compared
    against the outer viewport instead of the box that actually clips it. The inner viewport sits
    entirely inside the outer one — a positive control must not fix a document whose content is
    clipped away — and the inner label sits near the bottom of its own box. If the outer record
    claims it again, it is measured against the wrong viewport, which is what the live test
    asserts against.
  -->
  <svg id="outer" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="400" height="200" fill="#eeeeee"></rect>
    <text x="40" y="40" font-size="14" font-family="serif">Outer label</text>
    <svg id="inner" x="200" y="60" width="180" height="120" viewBox="0 0 180 120">
      <rect x="0" y="0" width="180" height="120" fill="#dddddd"></rect>
      <text x="10" y="100" font-size="12" font-family="serif">Inner label</text>
    </svg>
  </svg>
  <figcaption>Nested viewports: each label belongs to exactly one of them.</figcaption>
</figure>
</body>
</html>
