<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style>@page{size:120mm 80mm;margin:10mm}</style></head>
<body>
  <p>Der Snapshot darf spaeter eingefuegten Inhalt nicht verschweigen.</p>
  <script>
    const arm = setInterval(() => {
      if (!document.querySelector(".pagedjs_page")) return;
      clearInterval(arm);
      setTimeout(() => {
        const node = document.createElement('p');
        node.textContent = 'Zu spaet fuer den beurteilten Snapshot.';
        document.querySelector('.pagedjs_page_content').appendChild(node);
      }, 600);
    }, 10);
  </script>
</body></html>
