name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Belt and braces: the names of these two have changed across versions, so both are set.
      # A browser downloaded during install would make the licence job meaningless and the
      # install size a fiction.
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # `test:secrets` scans history, so a shallow clone would turn that promise into theatre.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: install the pinned secret scanner and verify its archive
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "8.30.1"

      - name: Git history, worktree and secret-scanner canary
        run: npm run test:secrets

      - name: annotated release-tag, release-pin and changelog contracts, each with its negative controls
        # The pin half compares .github/workflows/release.yml against package.json at THIS commit,
        # so a version bump that forgets the literal tag trigger fails here, on its pull request,
        # instead of starting nothing when the tag is pushed. The changelog half reads the release
        # tags, which is one more reason this job checks out with fetch-depth 0: without them it
        # fails rather than guessing which work is released.
        run: npm run test:release-tag

      - name: published dependency graph and pinned development advisory disposition
        run: npm run test:advisories

      - name: no browser was downloaded
        # Measured, not assumed. A guard whose effect nobody checks is a claim.
        run: |
          if [ -d "$HOME/.cache/puppeteer" ] || [ -d node_modules/puppeteer ]; then
            echo "a browser was downloaded during install; the skip flags did not hold"
            exit 1
          fi
          echo "no browser cache, no full puppeteer package"

      - name: the mark font is what its generator produces
        # The font is a binary constant in the source tree. Without this step the header of
        # src/render/mark-font.ts made a promise nobody kept: a hand-edit, or a generator change
        # without a regeneration, would travel inside every PDF this tool produces and no test
        # would notice. fontTools is a dev tool for one file and is installed here only.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check fonttools
          node tools/make-mark-font.mjs --check

      - name: typecheck
        run: npm run typecheck

      - name: generated configuration schema has no drift
        run: npm run schema:check

      - name: generated rule-page remediation blocks have no drift
        # AGENTS.md: a generated artifact is checked with its generator. Each docs/rules page
        # carries its rule's remediation.advice in a block tools/write-rule-docs.ts writes; until
        # this step only a unit test re-derived that assertion, and the generator's own --check
        # ran nowhere in CI.
        run: npm run docs:rules:check

      - name: unit and e2e tests
        run: npm test

      - name: mutation guard
        # A suite that passes tells you nothing until you know it can fail.
        run: npm run test:mutants

      - name: licences
        run: npm run test:licenses

      - name: poppler, as an independent rasteriser for the live suite
        # Never a dependency of the tool. It is here so that the live suite can check the product
        # rasteriser against something that is not Chrome — Chrome both produces and rasterises
        # every PDF, and without a second opinion a whole class of error cannot show up.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: live evidence path
        # This suite carries every claim about the rasteriser and the evidence binding. It FAILS
        # on a missing prerequisite rather than skipping, because a suite that goes green by
        # running nothing is how a check disappears. ubuntu-latest ships Chrome; paged.js and
        # pdfjs-dist come from `npm ci`.
        run: |
          BREAKLINT_LIVE_REPORT=.tmp/live-report.json BREAKLINT_LIVE_SUMMARY=.tmp/live-summary.json npm run test:live
          npm run test:documented-figures

      - name: admitted real-document acquisition gate
        # The live suites above use fixtures authored for this repository. This one binds the
        # rights-reviewed bytes of third-party and first-party published HTML documents and checks
        # their exact semantic reports, so exit 0 over zero pages cannot pass.
        run: |
          npm run build
          npm run test:real-document

      # There is deliberately no pagination-residue step. `npm run test:pagination-residue` binds
      # six private documents by digest, and that record is historical: the digests are reachable
      # nowhere, so the script prints NO CLAIM and exits 0 having read none of them, with or
      # without an artifact root. A step that exits 0 over zero documents is the shape this file
      # exists to prevent, so it was retired rather than kept as a green light. The class is held
      # by tests/fixtures/fragmentainer-residue.html in the live suite above, which is public and
      # carries no product text. tests/unit/workflow-gates.test.ts fails if the step returns.

      - name: technical report-surface matrix
        # Linux verifies all 32 current cells, including decoded-pixel, semantic, accessibility
        # and print integrity. The historical human ledger is deliberately not restamped by CI;
        # exact-environment human review remains a separate, explicit local gate.
        run: npm run test:report-surfaces:technical

      - name: physical report-edge mutation controls
        # Each mutation must produce a genuine failing renderer run. The targeted warning-state
        # matrix includes both the ordinary thin border and the strong left-border variant.
        run: npm run test:report-surface-mutants

      - name: self-application
        # The tool's own HTML report and its own docs pass its own error rules.
        run: npm run selfcheck

      - name: demo ends with exit 1
        # The one documented command. It must end with 1, because the fixture contains findings
        # on purpose — a demo that ends 0 never shows what a finding looks like.
        run: |
          set +e
          node --experimental-strip-types src/cli/index.ts --demo > /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "--demo exited $code, expected 1"; exit 1; }
          echo "--demo exit 1 as documented"

      - name: the BUILT package runs from a clean install
        # The step that would have caught the defect that shipped nothing.
        #
        # Every other step in this file calls the CLI by its own source path. A user never does
        # that: npm links `bin` as a SYMLINK, and node then receives the link path while the
        # module reports the real one. Comparing those two as strings made every installed copy
        # a silent no-op with exit 0 — which a build gate reads as a clean document.
        #
        # The unit test alongside this covers the mechanism on the source. THIS step covers the
        # artefact: built `dist/`, packed tarball, foreign directory, `npx`. `npm pack` runs
        # `prepack`, so it also proves dist/ was built from this commit rather than left over.
        run: |
          tgz=$(npm pack --silent)
          # An empty capture would turn the next line into a directory install, and every
          # assertion after it would still pass — a gate that silently checks nothing.
          test -n "$tgz" && test -s "$tgz" || { echo "npm pack produced no tarball"; exit 1; }
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE/$tgz" --no-audit --no-fund
          test "$(npx breaklint --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")" \
            || { echo "the installed package printed no version, or the wrong one"; exit 1; }
          set +e
          npx breaklint --demo > demo.out
          code=$?
          set -e
          test "$code" -eq 1 || { echo "installed --demo exited $code, expected 1"; cat demo.out; exit 1; }
          grep -q "uncalibrated" demo.out || { echo "installed --demo printed no findings"; exit 1; }
          # The README a user reads on npm is the one in this tarball. Its demo excerpt must be what
          # THIS installed bin prints, not what the source tree prints: the published 0.6.0 README
          # said "seven findings" while its own --demo printed five.
          node "$GITHUB_WORKSPACE/tests/tools/readme-demo-contract.mjs" --consumer "$PWD"
          # Every schema stamp the shipped README and docs name is the stamp THIS installed package
          # carries, read by running it. Mentions another change is still correcting are listed,
          # and a listed mention that no longer occurs fails too.
          node "$GITHUB_WORKSPACE/tests/tools/docs-truth.mjs" --package node_modules/breaklint \
            --pending "$GITHUB_WORKSPACE/tests/tools/docs-truth-pending.jsonl"
          node "$GITHUB_WORKSPACE/tests/tools/installed-config-contract.mjs"
          npm install --no-audit --no-fund --save-exact \
            pagedjs@0.4.3 pdfjs-dist@6.2.108 puppeteer-core@25.8.0
          node "$GITHUB_WORKSPACE/tests/tools/real-document-gate.mjs" \
            --cli "$PWD/node_modules/breaklint/dist/cli/index.js" \
            --cwd "$PWD"
          echo "installed package: --version and --demo behave as documented"

      - name: a missing prerequisite ends with exit 3 and one copyable install command
        # This step tested nothing for two runs, and the way it failed is the point.
        #
        # It used to set BREAKLINT_CHROME=/nonexistent and expect the run to stop for want of a
        # browser. ubuntu-latest ships Chrome, the resolver found it anyway, and the run went all
        # the way into pagination — where Paged.js threw on a Markdown file that had been handed
        # to it as HTML. Exit 3 arrived, so the first assertion passed; the install hint never
        # did, because nothing was missing. A test whose premise the environment quietly
        # falsifies reports on the environment, not on the promise.
        #
        # The prerequisite is missing for real now, in the situation a user actually reaches:
        # `npm i breaklint` and nothing else. The peers are optional, so npm installs none of
        # them, and the first run over real HTML must say which one to install rather than
        # crashing or — far worse for a checker — passing.
        run: |
          tgz=$(npm pack --silent)
          test -n "$tgz" && test -s "$tgz" || { echo "npm pack produced no tarball"; exit 1; }
          mkdir -p /tmp/bare && cd /tmp/bare
          npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE/$tgz" --no-audit --no-fund
          printf '<!doctype html><html><body><p>x</p></body></html>' > page.html
          set +e
          npx breaklint page.html 2>err.txt
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected exit 3, got $code"; cat err.txt; exit 1; }
          grep -q "install:" err.txt || { echo "no install command on stderr"; cat err.txt; exit 1; }
          echo "exit 3 with an install command:"; cat err.txt

  # The self-authored closed-world corpus gate (corpus/public/selfauthored-v1): twenty documents
  # with planted defects and clean controls, each judged against ground truth written before
  # breaklint ever ran on it. One invocation of the built CLI per document, default profile,
  # evidence binding on. Closed world: a finding no entry accounts for fails, and so do zero
  # documents, a hash mismatch or an unknown field in an expected file. It is a regression corpus,
  # not calibration evidence.
  #
  # Its own job, because it needs nothing but a build and a browser, and because while a document
  # still fails for a known, tracked cause, the gates after it in `check` must still run. It is not
  # optional: no continue-on-error, no condition, and a red job here is a red workflow.
  corpus:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: build the CLI the corpus gate runs
        run: npm run build
      - name: self-authored closed-world corpus gate
        run: npm run test:corpus

  # The complete gate runs on Node 24 above. `engines` starts at Node 22.13, so a packed-consumer
  # job exercises that exact lower bound rather than treating a newer runtime as proof for it.
  #
  # `engines` is a consumer promise. What a consumer runs is the built `dist/` from the tarball,
  # so that is the contract this lower-bound job exercises.
  node-floor:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: the packed package installs and runs on the version `engines` advertises
        run: |
          tgz=$(npm pack --silent)
          # An empty capture would turn the next line into a directory install, and every
          # assertion after it would still pass — a gate that silently checks nothing.
          test -n "$tgz" && test -s "$tgz" || { echo "npm pack produced no tarball"; exit 1; }
          mkdir -p /tmp/floor && cd /tmp/floor
          npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE/$tgz" --no-audit --no-fund
          test "$(npx breaklint --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")" \
            || { echo "no version, or the wrong one, on Node 22.13"; exit 1; }
          set +e
          npx breaklint --demo > demo.out
          code=$?
          set -e
          test "$code" -eq 1 || { echo "--demo exited $code on Node 22.13, expected 1"; cat demo.out; exit 1; }
          grep -q "uncalibrated" demo.out || { echo "--demo printed no findings on Node 22.13"; exit 1; }
          node "$GITHUB_WORKSPACE/tests/tools/readme-demo-contract.mjs" --consumer "$PWD"
          node "$GITHUB_WORKSPACE/tests/tools/installed-config-contract.mjs"
          echo "Node 22.13: the installed package behaves as documented"

  # The composite Action at the repository root (`action.yml`), run the way a consumer runs it
  # (`uses: ./`) over this repository's own fixtures, against the tarball this commit packs, with
  # the runner's own Chrome and the sandbox on. The arms that must fail run with
  # continue-on-error, so the job colour alone proves nothing; the last step reads every arm's
  # recorded outcome and outputs and validates the SARIF, JUnit and Markdown the Action wrote
  # (tests/tools/action-selftest.mjs). This job holds no write permission of any kind.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: pack this commit, and set the checkout's own dependencies aside
        id: pack
        run: |
          tgz=$(npm pack --silent)
          test -n "$tgz" && test -s "$tgz" || { echo "npm pack produced no tarball"; exit 1; }
          echo "tarball=$tgz" >> "$GITHUB_OUTPUT"
          # A consumer repository has no breaklint peers of its own. With this checkout's
          # node_modules in place breaklint would resolve those first, and the Action's own
          # install would go untested.
          mv node_modules "$RUNNER_TEMP/checkout-node_modules"

      - name: "arm: a clean document passes"
        id: clean
        uses: ./
        with:
          paths: tests/fixtures/action/clean.html
          breaklint-tarball: ${{ steps.pack.outputs.tarball }}
          output-dir: ${{ runner.temp }}/arm-clean
      - name: "arm: a gating finding fails the step (two documents, one glob)"
        id: findings
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/action/**/*.html
          breaklint-tarball: ${{ steps.pack.outputs.tarball }}
          output-dir: ${{ runner.temp }}/arm-findings
      - name: "arm: exit 1 left ungated on request"
        id: ungated
        uses: ./
        with:
          paths: tests/fixtures/action/findings.html
          fail-on-exit: "2,3,4"
          breaklint-tarball: ${{ steps.pack.outputs.tarball }}
          output-dir: ${{ runner.temp }}/arm-ungated
      - name: "arm: a font that fails to load is infrastructure, exit 3"
        id: infrastructure
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/missing-font.html
          breaklint-tarball: ${{ steps.pack.outputs.tarball }}
          output-dir: ${{ runner.temp }}/arm-infrastructure
      - name: "arm: a path that is not there, and shell syntax that must stay inert, exit 2"
        id: usage
        continue-on-error: true
        uses: ./
        with:
          # Executed by a shell, the first line would create the canary the assertion step
          # looks for.
          paths: |
            $(touch "$RUNNER_TEMP/breaklint-action-canary").html
            tests/fixtures/action/does-not-exist.html
          breaklint-tarball: ${{ steps.pack.outputs.tarball }}
          output-dir: ${{ runner.temp }}/arm-usage
      - name: "arm: a path that reads like an option stays a path, exit 2"
        id: dash
        continue-on-error: true
        uses: ./
        with:
          # Guarded, `--fail-on` reaches breaklint as the path ./--fail-on, which is not .html:
          # exit 2, no report. Unguarded it would be the option `--fail-on never`, and breaklint
          # would render findings.html and report it clean: exit 0, a report, verdict clean.
          # Only this arm tells the two apart; a `--demo` line would not, because the missing
          # path next to it ends an unguarded run with exit 2 as well.
          paths: |
            --fail-on
            never
            tests/fixtures/action/findings.html
          breaklint-tarball: ${{ steps.pack.outputs.tarball }}
          output-dir: ${{ runner.temp }}/arm-dash
      - name: "arm: a fail-on-exit that would let exit 4 pass is refused, exit 2"
        id: refused
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/action/clean.html
          fail-on-exit: "1,2,3"
          breaklint-tarball: ${{ steps.pack.outputs.tarball }}
          output-dir: ${{ runner.temp }}/arm-refused

      - name: the Action behaved as specified in every arm
        env:
          ARM_CLEAN: ${{ toJSON(steps.clean) }}
          ARM_FINDINGS: ${{ toJSON(steps.findings) }}
          ARM_UNGATED: ${{ toJSON(steps.ungated) }}
          ARM_INFRASTRUCTURE: ${{ toJSON(steps.infrastructure) }}
          ARM_USAGE: ${{ toJSON(steps.usage) }}
          ARM_DASH: ${{ toJSON(steps.dash) }}
          ARM_REFUSED: ${{ toJSON(steps.refused) }}
          INJECTION_CANARY: ${{ runner.temp }}/breaklint-action-canary
        run: |
          mv "$RUNNER_TEMP/checkout-node_modules" node_modules
          node tests/tools/action-selftest.mjs
      - name: keep the findings arm's SARIF for the optional code-scanning upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breaklint-action-sarif
          path: ${{ steps.findings.outputs.sarif-file }}
          if-no-files-found: error
          retention-days: 3

  # Uploading the fixture SARIF to code scanning is OFF unless a maintainer sets the repository
  # variable BREAKLINT_ACTION_UPLOAD_SARIF to 'true'. Whether code scanning is enabled here, and
  # whether fixture alerts belong in it, is a repository decision this workflow does not make.
  # Never for a fork's pull request: its token cannot write security events. The upload runs in
  # its own job so that the job rendering HTML in Chrome never holds security-events: write.
  action-code-scanning:
    needs: action
    if: >-
      vars.BREAKLINT_ACTION_UPLOAD_SARIF == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: breaklint-action-sarif
          path: ${{ runner.temp }}/breaklint-sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/breaklint-sarif
          category: breaklint-action-selftest
