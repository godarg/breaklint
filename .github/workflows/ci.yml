name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Belt and braces: the names of these two have changed across versions, so both are set.
      # A browser downloaded during install would make the licence job meaningless and the
      # install size a fiction.
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: no browser was downloaded
        # Measured, not assumed. A guard whose effect nobody checks is a claim.
        run: |
          if [ -d "$HOME/.cache/puppeteer" ] || [ -d node_modules/puppeteer ]; then
            echo "a browser was downloaded during install; the skip flags did not hold"
            exit 1
          fi
          echo "no browser cache, no full puppeteer package"

      - name: typecheck
        run: npm run typecheck

      - name: unit and e2e tests
        run: npm test

      - name: mutation guard
        # A suite that passes tells you nothing until you know it can fail.
        run: npm run test:mutants

      - name: licences
        run: npm run test:licenses

      - name: poppler, as an independent rasteriser for the live suite
        # Never a dependency of the tool. It is here so that the live suite can check the product
        # rasteriser against something that is not Chrome — Chrome both produces and rasterises
        # every PDF, and without a second opinion a whole class of error cannot show up.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: live evidence path
        # This suite carries every claim about the rasteriser and the evidence binding. It FAILS
        # on a missing prerequisite rather than skipping, because a suite that goes green by
        # running nothing is how a check disappears. ubuntu-latest ships Chrome; paged.js and
        # pdfjs-dist come from `npm ci`.
        run: npm run test:live

      - name: self-application
        # The tool's own HTML report and its own docs pass its own error rules.
        run: npm run selfcheck

      - name: demo ends with exit 1
        # The one documented command. It must end with 1, because the fixture contains findings
        # on purpose — a demo that ends 0 never shows what a finding looks like.
        run: |
          set +e
          node --experimental-strip-types src/cli/index.ts --demo > /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "--demo exited $code, expected 1"; exit 1; }
          echo "--demo exit 1 as documented"

      - name: the BUILT package runs from a clean install
        # The step that would have caught the defect that shipped nothing.
        #
        # Every other step in this file calls the CLI by its own source path. A user never does
        # that: npm links `bin` as a SYMLINK, and node then receives the link path while the
        # module reports the real one. Comparing those two as strings made every installed copy
        # a silent no-op with exit 0 — which a build gate reads as a clean document.
        #
        # The unit test alongside this covers the mechanism on the source. THIS step covers the
        # artefact: built `dist/`, packed tarball, foreign directory, `npx`. `npm pack` runs
        # `prepack`, so it also proves dist/ was built from this commit rather than left over.
        run: |
          tgz=$(npm pack --silent)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE/$tgz" --no-audit --no-fund
          test "$(npx breaklint --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")" \
            || { echo "the installed package printed no version, or the wrong one"; exit 1; }
          set +e
          npx breaklint --demo > demo.out
          code=$?
          set -e
          test "$code" -eq 1 || { echo "installed --demo exited $code, expected 1"; cat demo.out; exit 1; }
          grep -q "uncalibrated" demo.out || { echo "installed --demo printed no findings"; exit 1; }
          echo "installed package: --version and --demo behave as documented"

      - name: a live run with a missing prerequisite ends with exit 3 and a command to fix it
        # The promise is exit 3 plus ONE copyable install command on stderr — not exit 0, not
        # exit 1, not an empty success. Which prerequisite is missing depends on the runner:
        # ubuntu-latest ships Chrome, so the run gets past the browser and stops at paged.js.
        # Asserting on the specific message would make this step pass or fail for reasons that
        # have nothing to do with the promise, so it asserts on the promise itself.
        run: |
          set +e
          BREAKLINT_CHROME=/nonexistent node --experimental-strip-types src/cli/index.ts README.md 2>err.txt
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected exit 3, got $code"; cat err.txt; exit 1; }
          grep -q "install:" err.txt || { echo "no install command on stderr"; cat err.txt; exit 1; }
          echo "exit 3 with an install command:"; cat err.txt

  # `engines` says Node 20 or newer, and the job above runs 22 — so the lower bound was a claim
  # nothing checked.
  #
  # What this job may NOT do is run the test suite: the suite needs `--experimental-strip-types`,
  # which does not exist on Node 20, so a "floor" job built that way would fail for a reason that
  # has nothing to do with the floor. `engines` is a promise to the CONSUMER anyway, and what a
  # consumer runs is the built `dist/` out of the tarball. That is what this job installs and runs.
  node-floor:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: the packed package installs and runs on the version `engines` advertises
        run: |
          tgz=$(npm pack --silent)
          mkdir -p /tmp/floor && cd /tmp/floor
          npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE/$tgz" --no-audit --no-fund
          test "$(npx breaklint --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")" \
            || { echo "no version, or the wrong one, on Node 20"; exit 1; }
          set +e
          npx breaklint --demo > demo.out
          code=$?
          set -e
          test "$code" -eq 1 || { echo "--demo exited $code on Node 20, expected 1"; cat demo.out; exit 1; }
          grep -q "uncalibrated" demo.out || { echo "--demo printed no findings on Node 20"; exit 1; }
          echo "Node 20: the installed package behaves as documented"
