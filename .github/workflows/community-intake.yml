name: community-intake

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: community-intake
  cancel-in-progress: false

jobs:
  classify:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'community-test')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch automation without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use the repository's CI runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Classify form data without executing submission content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types tools/community-intake.ts
          --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --apply

  dashboard:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch automation without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use the repository's CI runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Reclassify public reports and update the public dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types tools/community-intake.ts
          --repo "$GITHUB_REPOSITORY" --sync
